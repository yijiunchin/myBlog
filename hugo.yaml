baseURL: "https://嗨.tw/"
defaultContentLanguage: zh-tw
hasCJKLanguage: true

pagination:
  pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# 所有語言共用
params:
  env: production
  images: ["/profile.png"] # 圖標 [ og:image ] ( 修改 )
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowWordCount: true
  hidemeta: false
  hideSummary: false
  disableSpecial1stPost: true

  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableScrollToTop: false
  comments: false
  showtoc: false
  tocopen: false

  # 你的網頁標題旁邊的圖標 ( 修改 )
  assets:
    favicon: "/profile.png"
    favicon16x16: "/profile.png"
    favicon32x32: "/profile.png"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

# 各語言各自的內容
languages:
  zh-tw:
    label: "中文" # 切換按鈕上的文字 ( 修改 )
    locale: zh-TW
    contentDir: content/zh-tw
    weight: 1
    title: YIJIUN Blog # 你的網頁標題 [ og:site_name / 首頁 og:title ] ( 修改 )
    params:
      description: "嗨嗨 歡迎來到我的 Blog" # 敘述 [ og:description ] ( 修改 )
      keywords: [部落格, 筆記] # 關鍵字 ( 修改 )
      author: yijiun # 作者名稱 ( 修改 )
      DateFormat: "2006 年 1 月 2 日"
      label:
        text: "YIJIUN Blog" # LOGO 文字 ( 修改 )
        icon: /profile.png # Logo 圖片 ( 修改 )
        iconHeight: 35
      # 首頁自我介紹 ( 修改 )
      homeInfoParams:
        Title: "嗨嗨 我是 yijiun" # 首頁標題 ( 修改 )
        Content: |
          收藏從未停止 行動從未開始

          我說手裡怎麼多了雙筷子，原來是刷到我的菜了
      # 首頁下方的社群圖示 ( 修改 )
      socialIcons:
        - name: instagram
          url: "https://yijiun.me/ig"
    menu:
      main:
        - identifier: posts
          name: Post
          url: /posts/
          weight: 10

  en:
    label: "English" # 切換按鈕上的文字 ( 修改 )
    locale: en-US
    contentDir: content/en
    weight: 2
    title: YIJIUN Blog # Site title [ og:title ] ( 修改 )
    params:
      description: "Welcome to my Blog" # [ og:description ] ( 修改 )
      keywords: [Blog, Notes] # ( 修改 )
      author: yijiun # ( 修改 )
      DateFormat: "January 2, 2006"
      label:
        text: "YIJIUN Blog" # ( 修改 )
        icon: /profile.png
        iconHeight: 35
      # 英文版首頁自我介紹 ( 修改 )
      homeInfoParams:
        Title: "Hi, I'm yijiun" # Homepage title ( 修改 )
        Content: |
          I have never stopped collecting, but I have never started taking action.

          I said, "Why do I have a pair of chopsticks in my hand?" It turns out that I brushed to my dish.
      socialIcons:
        - name: instagram
          url: "https://yijiun.me/ig"
    menu:
      main:
        - identifier: posts
          name: Post
          url: /en/posts/
          weight: 10

pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true                               # allow raw HTML, e.g. <img width="300">
    parser:
      wrapStandAloneImageWithinParagraph: false  # required for image attributes below
      attribute:
        block: true                              # allow {width="300"} on the line after an image
  highlight:
    noClasses: false
